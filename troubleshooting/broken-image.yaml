# TROUBLESHOOTING LAB 1: a Deployment whose image tag does not exist.
#
#   kubectl apply -f troubleshooting/broken-image.yaml
#   kubectl get pods -n taskboard                        -> ErrImagePull / ImagePullBackOff
#   kubectl describe pod -n taskboard -l app=broken-image-demo
#   kubectl get events -n taskboard --sort-by=.lastTimestamp
#
# Fix: point the Deployment at a tag that exists, e.g.
#   kubectl set image -n taskboard deployment/broken-image-demo api=ghcr.io/pushkardesai-06/taskboard-backend:latest
# (or edit the tag below and apply again). Clean up with:
#   kubectl delete -f troubleshooting/broken-image.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image-demo
  namespace: taskboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-image-demo
  template:
    metadata:
      labels:
        app: broken-image-demo
    spec:
      containers:
        - name: api
          image: ghcr.io/pushkardesai-06/taskboard-backend:v9.9.9-does-not-exist
          ports:
            - containerPort: 8000
