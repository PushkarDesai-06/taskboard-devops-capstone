{{- if .Values.monitoring.serviceMonitor.enabled }}
# Tells the Prometheus Operator to scrape FastAPI's /metrics on every backend pod.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "taskboard.fullname" . }}-backend
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "taskboard.selectorLabels" (list . "backend") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
