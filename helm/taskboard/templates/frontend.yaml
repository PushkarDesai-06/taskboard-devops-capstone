{{- $name := printf "%s-frontend" (include "taskboard.fullname" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
    {{- include "taskboard.selectorLabels" (list . "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "taskboard.selectorLabels" (list . "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taskboard.labels" . | nindent 8 }}
        {{- include "taskboard.selectorLabels" (list . "frontend") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # Nginx inside the pod proxies /api to the backend Service.
            - name: BACKEND_URL
              value: "http://{{ include "taskboard.fullname" . }}-backend:{{ .Values.backend.port }}"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
    {{- include "taskboard.selectorLabels" (list . "frontend") | nindent 4 }}
spec:
  selector:
    {{- include "taskboard.selectorLabels" (list . "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
