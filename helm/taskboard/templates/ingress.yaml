{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "taskboard.fullname" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          # /api goes straight to FastAPI
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "taskboard.fullname" . }}-backend
                port:
                  name: http
          # everything else is the React app
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "taskboard.fullname" . }}-frontend
                port:
                  name: http
{{- end }}
