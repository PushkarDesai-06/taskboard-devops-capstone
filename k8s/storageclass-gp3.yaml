# EBS gp3 volumes for PersistentVolumeClaims on EKS (used by PostgreSQL).
# Requires the aws-ebs-csi-driver add-on, which Terraform installs.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
