# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors from every namespace and every release,
    # not only those labelled for this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 2d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

grafana:
  adminPassword: taskboard-admin   # demo only
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      # The TaskBoard dashboard ConfigMap lives in the taskboard namespace.
      searchNamespace: ALL

# Not needed for the classroom demo; saves a pod and some memory.
alertmanager:
  enabled: false
